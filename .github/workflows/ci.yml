name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks binary
        run: |
          curl --retry 5 --retry-all-errors -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the full Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Generate web runtime SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > ads-web.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: ads-web-runtime-sbom
          path: web/ads-web.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yodev_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yodev_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      NODE_OPTIONS: --conditions=react-server
      DATABASE_DRIVER: node-postgres
      DATABASE_URL: postgresql://postgres@localhost:5432/yodev_test
      DATABASE_URL_UNPOOLED: postgresql://postgres@localhost:5432/yodev_test
      DATABASE_AUTHENTICATED_URL: postgresql://postgres@localhost:5432/yodev_test
      DATABASE_SYSTEM_URL: postgresql://postgres@localhost:5432/yodev_test
      DATABASE_PURGE_URL: postgresql://postgres@localhost:5432/yodev_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Apply committed migrations
        run: npx drizzle-kit migrate
      - name: Seed isolated RLS fixtures
        run: npx tsx scripts/seed-rls-verification.ts
      - name: Verify RLS and database roles
        run: npx tsx scripts/verify-rls.ts
      - name: Validate composite tenant constraints
        run: npx tsx scripts/validate-tenant-constraints.ts
      - name: Verify tenant invariants
        run: npx tsx scripts/verify-tenant-invariants.ts
      - name: Verify database concurrency and lifecycle protocols
        run: npx tsx scripts/verify-database-concurrency.ts
      - name: Verify database load and bounded connection pools
        env:
          DATABASE_POOL_MAX: '10'
        run: npx tsx scripts/verify-database-load.ts

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install pip-audit
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m pip_audit
      - name: Generate CLI runtime SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install .
          cyclonedx-py environment .sbom-venv/bin/python \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file ads-cli.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: ads-cli-runtime-sbom
          path: ads-cli.cdx.json
          if-no-files-found: error
          retention-days: 30
