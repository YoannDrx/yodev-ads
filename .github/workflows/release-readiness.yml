name: Release readiness

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Configuration and GitHub environment to verify
        type: choice
        required: true
        options:
          - staging
          - private_beta
          - public
      base_url:
        description: Exact HTTPS deployment URL to exercise
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ inputs.release_target }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_target }}
    defaults:
      run:
        working-directory: web
    env:
      RELEASE_TARGET: ${{ inputs.release_target }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      NEXT_PUBLIC_APP_URL: ${{ inputs.base_url }}
      DATABASE_AUTHENTICATED_URL: ${{ secrets.DATABASE_AUTHENTICATED_URL }}
      DATABASE_SYSTEM_URL: ${{ secrets.DATABASE_SYSTEM_URL }}
      DATABASE_PURGE_URL: ${{ secrets.DATABASE_PURGE_URL }}
      DATABASE_AUTH_URL: ${{ secrets.DATABASE_AUTH_URL }}
      PRODUCTION_DATA_REGION: ${{ vars.PRODUCTION_DATA_REGION }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.BETTER_AUTH_GOOGLE_CLIENT_ID }}
      BETTER_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTER_AUTH_GOOGLE_CLIENT_SECRET }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      OAUTH_STATE_KEY: ${{ secrets.OAUTH_STATE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      YODEV_MAIL_API_URL: ${{ vars.YODEV_MAIL_API_URL }}
      YODEV_MAIL_API_KEY: ${{ secrets.YODEV_MAIL_API_KEY }}
      YODEV_MAIL_WEBHOOK_SECRET: ${{ secrets.YODEV_MAIL_WEBHOOK_SECRET }}
      YODEV_MAIL_RECIPIENT_HASH_SECRET: ${{ secrets.YODEV_MAIL_RECIPIENT_HASH_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_SOLO: ${{ vars.STRIPE_PRICE_SOLO }}
      STRIPE_PRICE_STUDIO: ${{ vars.STRIPE_PRICE_STUDIO }}
      STRIPE_PRICE_AGENCY: ${{ vars.STRIPE_PRICE_AGENCY }}
      STRIPE_PORTAL_CONFIGURATION_ID: ${{ vars.STRIPE_PORTAL_CONFIGURATION_ID }}
      PUBLIC_API_ENABLED: ${{ vars.PUBLIC_API_ENABLED }}
      SCHEDULER_ENABLED: ${{ vars.SCHEDULER_ENABLED }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED }}
      PUBLIC_BETA_ENABLED: ${{ vars.PUBLIC_BETA_ENABLED }}
      STRIPE_CHECKOUT_ENABLED: ${{ vars.STRIPE_CHECKOUT_ENABLED }}
      LEGAL_DOCUMENTS_APPROVED: ${{ vars.LEGAL_DOCUMENTS_APPROVED }}
      GOOGLE_MUTATIONS_ENABLED: ${{ vars.GOOGLE_MUTATIONS_ENABLED }}
      FORCE_READ_ONLY: ${{ vars.FORCE_READ_ONLY }}
      MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
      LEGACY_AUTH_ROLLBACK_ENABLED: ${{ vars.LEGACY_AUTH_ROLLBACK_ENABLED }}
      PLAYWRIGHT_OWNER_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_OWNER_STORAGE_STATE_BASE64 }}
      PLAYWRIGHT_ADMIN_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_ADMIN_STORAGE_STATE_BASE64 }}
      PLAYWRIGHT_STRATEGIST_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_STRATEGIST_STORAGE_STATE_BASE64 }}
      PLAYWRIGHT_ANALYST_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_ANALYST_STORAGE_STATE_BASE64 }}
      PLAYWRIGHT_CLIENT_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_CLIENT_STORAGE_STATE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Materialize short-lived authenticated browser states
        run: node scripts/materialize-playwright-storage-states.mjs
      - name: Verify code, release configuration and authenticated staging
        run: npm run release:verify
