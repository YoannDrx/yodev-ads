[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vigieads"
version = "0.1.0"
description = "A safe, multi-client command line cockpit for Google Ads"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Yoann Andrieux" }]
dependencies = [
  "google-ads>=30.1,<31",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
vigie = "vigie_ads.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_ads"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
